<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/home" routerDirection="back" aria-label="Voltar para o início">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Convidados</ion-title>

    <ion-buttons slot="end">
      <ion-button routerLink="/convidados/novo">
        <ion-icon name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <p class="evento-atual" *ngIf="evento">
    {{ evento.nome }}<span *ngIf="evento.dataEvento"> · {{ evento.dataEvento | date:'dd/MM/yyyy':'UTC' }}</span>
  </p>

  <ion-spinner *ngIf="carregando"></ion-spinner>

  <ion-list *ngIf="!carregando && convidados.length > 0">

    <ion-item-sliding *ngFor="let convidado of convidados">

      <ion-item>
        <ion-label>
          <h2>{{ convidado.nome }}</h2>
          <p *ngIf="convidado.email">{{ convidado.email }}</p>
          <p>Acompanhantes: <strong>{{ convidado.quantidadeAcompanhantes || 0 }}</strong></p>
          <ion-buttons class="acompanhantes-actions">
            <ion-button size="small" fill="outline" (click)="alterarAcompanhantes(convidado, -1)">
              <ion-icon name="remove-outline"></ion-icon>
            </ion-button>
            <ion-button size="small" fill="outline" (click)="alterarAcompanhantes(convidado, 1)">
              <ion-icon name="add-outline"></ion-icon>
            </ion-button>
          </ion-buttons>
          <ion-chip
            class="status-chip"
            [color]="statusColor(convidado)"
            (click)="editarConfirmacao(convidado)">

            <ion-label>
              {{ textoConfirmacao(convidado.confirmacaoPresenca) }}
            </ion-label>

          </ion-chip>

          <ion-button size="small" fill="clear" (click)="editarConvidado(convidado)">
            Editar dados
          </ion-button>
        </ion-label>

        <ion-buttons slot="end" class="acoes-card">
          <ion-button color="danger" (click)="confirmarExclusao(convidado)" aria-label="Excluir convidado">
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="confirmarExclusao(convidado)">
          Excluir
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>

  </ion-list>

  <ion-text *ngIf="!carregando && convidados.length === 0">
    Nenhum convidado cadastrado.
  </ion-text>

</ion-content>
