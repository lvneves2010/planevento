<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/home" routerDirection="back" aria-label="Voltar para o início">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ titulo }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-spinner *ngIf="carregando"></ion-spinner>

  <form *ngIf="!carregando">

    <ion-item>
      <ion-label position="stacked">Nome do evento</ion-label>
      <ion-input [(ngModel)]="form.nome" name="nome" required></ion-input>
    </ion-item>

    <!-- a data ocupa uma linha; o calendário abre num pop-up ao tocar -->
    <ion-item button detail="false" (click)="calendarioAberto = true">
      <ion-label position="stacked">Data do evento</ion-label>
      <div class="valor-data" [class.vazia]="!form.dataEvento">
        <ion-icon name="calendar-outline"></ion-icon>
        {{ form.dataEvento ? (form.dataEvento | date:'dd/MM/yyyy':'UTC') : 'Toque para escolher' }}
      </div>
    </ion-item>

    <ion-modal
      class="modal-calendario"
      [isOpen]="calendarioAberto"
      (didDismiss)="calendarioAberto = false">
      <ng-template>
        <ion-datetime
          presentation="date"
          locale="pt-BR"
          [value]="form.dataEvento || null"
          [showDefaultButtons]="true"
          [showClearButton]="true"
          doneText="OK"
          cancelText="Cancelar"
          clearText="Limpar"
          (ionChange)="escolherData($event)">
        </ion-datetime>
      </ng-template>
    </ion-modal>

    <ion-item>
      <ion-label position="stacked">Local</ion-label>
      <ion-input [(ngModel)]="form.local" name="local"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Observações</ion-label>
      <ion-textarea
        [(ngModel)]="form.observacoes"
        name="observacoes"
        rows="2"
        [autoGrow]="true">
      </ion-textarea>
    </ion-item>

    <div class="acoes">
      <ion-button
        *ngIf="evento"
        fill="outline"
        color="danger"
        (click)="confirmarExclusao()">
        <ion-icon slot="start" name="trash-outline"></ion-icon>
        Excluir
      </ion-button>
      <ion-button (click)="salvar()">
        <ion-icon slot="start" name="checkmark-outline"></ion-icon>
        Salvar
      </ion-button>
    </div>

  </form>

  <ion-button
    *ngIf="anuncios.precisaOpcoesPrivacidade$ | async"
    expand="block"
    fill="clear"
    size="small"
    class="ion-margin-top"
    (click)="anuncios.abrirOpcoesPrivacidade()">
    Privacidade dos anúncios
  </ion-button>

</ion-content>
